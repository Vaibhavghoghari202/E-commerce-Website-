<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .success-container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .success-icon {
            font-size: 4rem;
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-container">
            <div class="success-icon mb-3">
                ✅
            </div>
            <h2 class="mb-3">Payment Successful!</h2>
            <p class="lead">Thank you for your purchase. Your transaction has been completed successfully.</p>
            <a href="/shop" class="btn btn-success mt-4">Continue Shopping</a>
        </div>
    </div>
    <script>
        const orderId = "{{ order_id }}";
        alert("Thank you for your order! Your Order ID is " +  orderId  + ". Your cart will now be cleared.");
        localStorage.clear();
        setTimeout(() => {
            window.location.href = "/shop";
        }, 3000);
    </script>
</body>
</html>
