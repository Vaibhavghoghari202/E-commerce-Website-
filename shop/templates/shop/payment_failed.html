<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .fail-container {
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }
        .fail-icon {
            font-size: 4rem;
            color: #dc3545;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="fail-container">
            <div class="fail-icon mb-3">
                ❌
            </div>
            <h2 class="mb-3">Payment Failed</h2>
            <p class="lead">Oops! Something went wrong during the transaction. Please try again or use a different payment method.</p>
            <a href="/shop/checkout/" class="btn btn-danger mt-4">Try Again</a>
        </div>
    </div>

</body>
</html>
